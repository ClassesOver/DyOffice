[project]
name = "dyoffice-analysis-runtime"
version = "0.1.0"
description = "Office 内外部 harness 共用的离线数据处理与分析环境"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3", "pandas>=2.2,<4", "polars>=1,<2", "duckdb>=1.2,<2", "pyarrow>=18,<24",
  "scipy>=1.14,<2", "statsmodels>=0.14,<0.15", "scikit-learn>=1.5,<2", "sympy>=1.13,<2",
  "matplotlib>=3.9,<4", "seaborn>=0.13,<0.14", "plotly>=6,<7", "pillow>=11,<13",
  "openpyxl>=3.1,<4", "xlsxwriter>=3.2,<4", "xlrd>=2,<3", "pyxlsb>=1.0,<2",
  "python-calamine>=0.3,<1", "odfpy>=1.4,<2",
  "orjson>=3.10,<4", "pyyaml>=6,<7", "lxml>=5,<7", "beautifulsoup4>=4.12,<5", "defusedxml>=0.7,<1",
  "python-docx>=1.1,<2", "python-pptx>=1,<2", "pypdf>=6,<7", "reportlab>=4,<5",
  "sqlalchemy>=2,<3", "sqlglot>=26,<31", "sqlparse>=0.5,<1", "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2", "sqlite-utils>=3.38,<4",
  "python-dateutil>=2.9,<3", "pytz>=2025.1", "babel>=2.16,<3", "pint>=0.24,<1",
  "rapidfuzz>=3.11,<4", "tabulate>=0.9,<1", "rich>=13,<15", "networkx>=3.4,<4",
  "chardet>=5,<6", "charset-normalizer>=3.4,<4", "pytest>=8,<10", "hypothesis>=6,<7",
]

[tool.uv]
package = false
