[package]
name = "dyoffice-document-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
license = "Apache-2.0"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "p2p"] }
time = { version = "=0.3.55", features = ["parsing"] }
