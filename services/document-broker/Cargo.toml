[package]
name = "dyoffice-document-broker"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
default-run = "dyoffice-document-broker"
license = "Apache-2.0"

[dependencies]
rustix = { version = "=1.1.6", features = ["fs", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio", "p2p"] }
time = { version = "=0.3.55", features = ["parsing"] }

futures-util = "=0.3.34"

[features]
unsafe-test-harness = []

[[example]]
name = "admission-fixture"
path = "examples/admission-fixture.rs"
required-features = ["unsafe-test-harness"]
