name: DyOffice T03b session core

on:
  push:
    branches: [feat/dyoffice-t03b-session-core]
    paths:
      - 'apps/web/server/auth/session-core.mjs'
      - 'apps/web/test/session-core.test.mjs'
      - 'apps/web/test/integration/session-core.postgres.test.mjs'
      - '.github/workflows/dyoffice-t03b-sessions.yml'
  pull_request:
    paths:
      - 'apps/web/server/auth/session-core.mjs'
      - 'apps/web/test/session-core.test.mjs'
      - 'apps/web/test/integration/session-core.postgres.test.mjs'
      - '.github/workflows/dyoffice-t03b-sessions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dyoffice_test
          POSTGRES_PASSWORD: local-ci-only-not-for-production
          POSTGRES_DB: dyoffice_session_test
        ports: [5432]
        options: >-
          --health-cmd "pg_isready -U dyoffice_test -d dyoffice_session_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check session files for syntax errors
        run: |
          node --check apps/web/server/auth/session-core.mjs
          node --check apps/web/test/session-core.test.mjs
          node --check apps/web/test/integration/session-core.postgres.test.mjs
      - name: Test cookie parsing and scoped session service
        run: node --test apps/web/test/session-core.test.mjs
      - name: Install isolated Web dependencies
        run: npm ci --prefix apps/web --workspaces=false --include=dev --no-audit --no-fund
      - name: Test PostgreSQL session lifecycle, expiry, revocation and deployment isolation
        env:
          DYOFFICE_TEST_DATABASE_URL: postgresql://dyoffice_test:local-ci-only-not-for-production@localhost:5432/dyoffice_session_test
        run: node --test apps/web/test/integration/session-core.postgres.test.mjs
