name: DyOffice one-time identity dependency lock synchronization

# Temporary, feature-branch-only job. Triggered solely by apps/web/package.json.
# Once dependency lock regeneration is verified, this workflow should be
# removed. Production branches never receive write permission here.
on:
  push:
    branches: [feat/dyoffice-web]
    paths:
      - 'apps/web/package.json'

permissions:
  contents: write

concurrency:
  group: dyoffice-identity-lock-feature
  cancel-in-progress: false

jobs:
  lock-and-verify:
    if: github.repository == 'ClassesOver/DyOffice'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dyoffice_test
          POSTGRES_PASSWORD: local-ci-only-not-for-production
          POSTGRES_DB: dyoffice_identity_test
        ports: [5432]
        options: >-
          --health-cmd "pg_isready -U dyoffice_test -d dyoffice_identity_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Resolve isolated Web lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix apps/web --workspaces=false --include=dev --no-audit --no-fund
      - name: Resolve root workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --workspaces=true --no-audit --no-fund
      - name: Reconcile dependency provenance baseline
        run: node tools/dyoffice/compatibility-baseline.mjs --write
      - name: Install Web dependencies including Argon2id native binary
        run: npm ci --prefix apps/web --workspaces=false --include=dev --no-audit --no-fund
      - name: Run legacy Web tests and native identity security checks
        env:
          DYOFFICE_TEST_DATABASE_URL: postgresql://dyoffice_test:local-ci-only-not-for-production@localhost:${{ job.services.postgres.ports[5432] }}/dyoffice_identity_test
        run: |
          node --test apps/web/test/integration/bootstrap-cli.test.mjs
          node --test apps/web/test/integration/local-identity.test.mjs
          npm run test:web
      - name: Validate Web build/typecheck and compatibility baseline
        run: |
          npm run typecheck:web
          npm run test:web:build
          node tools/dyoffice/compatibility-baseline.mjs --check
      - name: Commit only generated dependency locks and baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json apps/web/package-lock.json docs/dyoffice/inventory/compatibility-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes required'
          else
            git commit -m 'chore(auth): lock PostgreSQL and Argon2id dependencies'
            git push origin HEAD:feat/dyoffice-web
          fi
