name: DyOffice Web boundary gate

on:
  push:
    branches: [main, feat/dyoffice-web]
    paths:
      - 'package.json'
      - 'apps/**'
      - 'packages/**'
      - 'tools/check-web-boundaries*'
      - 'tools/audit-web-host*'
      - '.github/workflows/dyoffice-web-boundaries.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'apps/**'
      - 'packages/**'
      - 'tools/check-web-boundaries*'
      - 'tools/audit-web-host*'
      - '.github/workflows/dyoffice-web-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Web gate dependencies without Electron
        run: npm ci --prefix apps/web --workspaces=false --ignore-scripts --include=dev
      - name: Test browser dependency gate
        run: node --test tools/check-web-boundaries.test.mjs
      - name: Test BrowserHost contracts
        run: node --experimental-strip-types --test apps/web/test/unit/host-contract.test.mjs
      - name: Test editor host inventory scanner
        run: node --test tools/audit-web-host.test.mjs
      - name: Scan four native editor bridges
        run: |
          node tools/audit-web-host.mjs > "$RUNNER_TEMP/dyoffice-host-audit.json"
          node -e 'const a=require(process.env.RUNNER_TEMP+"/dyoffice-host-audit.json"); for(const [name,v] of Object.entries(a)) console.log(name+": "+v.declaredCount+" methods, "+v.unknownRendererMethods.length+" unmatched")'
      - name: Reject Node or Electron imports in the local Web dependency graph
        run: node tools/check-web-boundaries.mjs
      - name: Typecheck BrowserHost and Web contracts
        run: npm run typecheck:web
      - name: Build and HTTP smoke test the Web prototype
        run: npm run test:web:build
      - name: Test legacy Web API
        run: npm run test:web
