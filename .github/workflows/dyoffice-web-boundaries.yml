name: DyOffice Web boundary gate

on:
  push:
    branches: [main, feat/dyoffice-web]
    paths:
      - 'deploy/docker/document-runtime-diagnostic/**'
      - 'services/document-broker/**'
      - 'tools/dyoffice/runtime-lock*'
      - 'package.json'
      - 'package-lock.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'tools/dyoffice/**'
      - 'docs/dyoffice/inventory/compatibility*'
      - 'apps/**'
      - 'packages/**'
      - 'tools/check-web-boundaries*'
      - 'tools/run-web-unit.mjs'
      - 'tools/audit-web-host*'
      - 'tools/dyoffice/host-ipc-classification*'
      - 'docs/dyoffice/inventory/host-ipc*'
      - 'docs/dyoffice/inventory/agent-tools*'
      - '.github/workflows/dyoffice-web-boundaries.yml'
      - '.github/workflows/dyoffice-ubuntu-docker-audit.yml'
  pull_request:
    paths:
      - 'deploy/docker/document-runtime-diagnostic/**'
      - 'services/document-broker/**'
      - 'tools/dyoffice/runtime-lock*'
      - 'package.json'
      - 'package-lock.json'
      - 'LICENSE'
      - 'NOTICE'
      - 'tools/dyoffice/**'
      - 'docs/dyoffice/inventory/compatibility*'
      - 'apps/**'
      - 'packages/**'
      - 'tools/check-web-boundaries*'
      - 'tools/run-web-unit.mjs'
      - 'tools/audit-web-host*'
      - 'tools/dyoffice/host-ipc-classification*'
      - 'docs/dyoffice/inventory/host-ipc*'
      - 'docs/dyoffice/inventory/agent-tools*'
      - '.github/workflows/dyoffice-web-boundaries.yml'
      - '.github/workflows/dyoffice-ubuntu-docker-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No container launch or privileged host provisioning in this job.
  diagnostic-regression:
    name: Diagnostic static and fixture regression (not isolation acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.5'
      - name: Verify immutable Node runtime
        run: node tools/dyoffice/runtime-lock.mjs --runtime
      - name: Install pinned YAML parser in an isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/diagnostic-python"
          "$RUNNER_TEMP/diagnostic-python/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
      - name: Run diagnostic syntax and fixture tests only
        run: |
          export PATH="$RUNNER_TEMP/diagnostic-python/bin:$PATH"
          for script in deploy/docker/document-runtime-diagnostic/*.sh; do sh -n "$script"; done
          python -m py_compile deploy/docker/document-runtime-diagnostic/*.py
          python -m unittest discover -s deploy/docker/document-runtime-diagnostic/tests -v
      - name: State the limited evidence scope
        if: always()
        run: |
          printf '%s\n' '## Diagnostic regression only' 'Static contracts and synthetic evidence tests; not Ubuntu/Docker isolation acceptance.' 'No Docker build/up, systemd unit launch, production runtime grant or business document execution occurred in this job.' >> "$GITHUB_STEP_SUMMARY"
  boundary-check:
    runs-on: ubuntu-24.04
    # The serial four-editor Chromium suite alone can take about 40 minutes.
    timeout-minutes: 75
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      DYOFFICE_TEST_REDIS_URL: redis://127.0.0.1:16379/15
      DYOFFICE_TEST_S3_ENDPOINT: http://127.0.0.1:19000
      DYOFFICE_TEST_S3_ACCESS_KEY: dyoffice-ci-s3-test
      DYOFFICE_TEST_S3_SECRET_KEY: dyoffice-ci-s3-test-only-secret
      DYOFFICE_TEST_DATABASE_URL: postgresql://postgres:dyoffice-ci-test-only@127.0.0.1:55432/dyoffice_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.5'
      - name: Verify immutable Node runtime
        run: node tools/dyoffice/runtime-lock.mjs --runtime
      - name: Verify immutable host Node
        run: node tools/dyoffice/host-runtime.mjs --node-only
      - name: Provision host database Redis and object storage
        run: sudo --preserve-env=GITHUB_ACTIONS bash tools/dyoffice/ci-host-services.sh --objectstore
      - name: Verify actual host runtime
        run: node tools/dyoffice/host-runtime.mjs --objectstore
      - name: Install workspace dependencies without launching Electron
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify wrong-database rejection in isolated PostgreSQL
        env:
          DYOFFICE_LEGACY_GUARD_TEST_DATABASE_URL: postgresql://postgres:dyoffice-ci-test-only@127.0.0.1:55432/dyoffice_test_legacy_guard
        run: |
          cd apps/web
          node --input-type=module -e 'import { Pool } from "pg"; const p = new Pool({connectionString: process.env.DYOFFICE_TEST_DATABASE_URL}); try { await p.query("CREATE DATABASE dyoffice_test_legacy_guard"); } finally { await p.end(); }'
          node --import tsx --test test/db-safety/*.test.mjs
      - name: Install Chromium for TLS session acceptance
        run: npm exec --workspace @dyoffice/web -- playwright install chromium --with-deps
      - name: Test compatibility baseline and CI coverage
        run: node --test tools/dyoffice/*.test.mjs
      - name: Check reviewed Agent and MCP tool placements
        run: node tools/dyoffice/agent-tool-inventory.mjs --check
      - name: Reject unreviewed dependency and font baseline drift
        run: node tools/dyoffice/compatibility-baseline.mjs --check
      - name: Test browser dependency gate
        run: node --test tools/check-web-boundaries.test.mjs
      - name: Test BrowserHost contracts and PDF form routes
        run: npm run test:web:unit -- host-contract.test.mjs pdf-form-fields-routes.test.mjs office-tool-coverage.test.mjs
      - name: Test account session transitions
        run: npm run test:shell --workspace @dyoffice/web -- account-lifecycle.test.ts
      - name: Test Argon2 password policy and bounded work
        run: node --experimental-strip-types --test apps/web/test/unit/passwords.test.mjs
      - name: Test SSE AgentTransport adapter
        run: node --import tsx --test apps/web/test/unit/ai-transport.test.mjs
      - name: Test HTTP BrowserHost read adapter
        run: node --experimental-strip-types --test apps/web/test/unit/http-files.test.mjs
      - name: Test save generation guard
        run: node --experimental-strip-types --test apps/web/test/unit/save-generation.test.mjs
      - name: Test revision commits and leases
        run: node --experimental-strip-types --test apps/web/test/integration/revision-commit.test.mjs
      - name: Test editor host inventory scanner
        run: node --test tools/audit-web-host.test.mjs
      # Fails on renderer calls to undeclared bridge members or unresolvable preload members.
      - name: Scan four native editor bridges
        run: node tools/audit-web-host.mjs --summary
      - name: Test host IPC classification
        run: node --test tools/dyoffice/host-ipc-classification.test.mjs
      # Every preload member must map to exactly one Web class; generated table must be current.
      - name: Check four-format host IPC classification
        run: node tools/dyoffice/host-ipc-classification.mjs --check
      - name: Reject Node or Electron imports in the local Web dependency graph
        run: node tools/check-web-boundaries.mjs
      - name: Typecheck BrowserHost and Web contracts
        run: npm run typecheck:web
      - name: Build and HTTP smoke test the Web prototype
        run: npm run test:web:build
      - name: Install browser fixture dependencies
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-matplotlib tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim fonts-noto-cjk fonts-liberation fonts-dejavu-core
      - name: Verify the real PDF OCR engine and language data
        env:
          DYOFFICE_TEST_PDF_OCR: '1'
        run: |
          languages=$(tesseract --list-langs)
          grep -Fx eng <<< "$languages"
          grep -Fx chi_sim <<< "$languages"
          node --import tsx --test apps/web/test/unit/pdf-ocr.test.mjs
      - name: Build the four native Web editors and local workspace
        run: npm run build:saas
      - name: Build the XLSX engine for browser file verification
        run: npm run build:web:native
      - name: Verify the local workspace and four native editors in Chromium
        env:
          NODE_ENV: test
          DYOFFICE_TEST_LOCAL_SHELL_DIRECTORY: ${{ github.workspace }}/apps/web/dist-local-shell
          DYOFFICE_TEST_NATIVE_DOCS_DIST: ${{ github.workspace }}/apps/web/dist-docs
          DYOFFICE_TEST_SHEETS_DIST: ${{ github.workspace }}/apps/web/dist-sheets
          DYOFFICE_TEST_SLIDES_DIST: ${{ github.workspace }}/apps/web/dist-slides
          DYOFFICE_TEST_NATIVE_PDF_DIST: ${{ github.workspace }}/apps/web/dist-pdf
          DYOFFICE_TEST_HOST_MANIFEST: ${{ github.workspace }}/.dyoffice-native-build/host-manifest.json
          DYOFFICE_TEST_ANALYSIS_PYTHON: /usr/bin/python3
          DYOFFICE_TEST_PDF_OCR: '1'
          DYOFFICE_DSH_FIXTURE: 'on'
          DYOFFICE_TEST_AI_TOOL_TRACE: ${{ runner.temp }}/dyoffice-office-tool-trace.jsonl
        # Some editor fixtures bind the same loopback port.
        run: |
          umask 077
          : > "$DYOFFICE_TEST_AI_TOOL_TRACE"
          node --import tsx --test --test-concurrency=1 apps/web/test/local-browser/*.test.mjs apps/web/test/native-docs/{attachment-media,image-media,writer-draft-save}.test.mjs apps/web/test/native-slides/{size-roundtrip,image-export}.test.mjs
          node --import tsx apps/web/test/helpers/office-tool-coverage.mjs "$DYOFFICE_TEST_AI_TOOL_TRACE"
      - name: Retain real local-account Home and Settings screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-account-original-shell
          path: test-results/local-shell-*.png
          if-no-files-found: warn
      - name: Test isolated local account and revision runtime
        run: npm run test:web:integration:local
      - name: Test durable PostgreSQL jobs and real BullMQ recovery
        run: npm run test:web:jobs
      - name: Test immutable storage and bounded structural validation
        run: npm run test:web:storage
      - name: Test browser session lifecycle over TLS
        run: npm run test:web:e2e
      - name: Test legacy Web API
        run: npm run test:web
      - name: Test modular API compatibility shell
        run: npm run test:web:integration -- test/integration/api-compat.test.mjs
      - name: Test legacy routes on the Fastify shell
        run: npm run test:web:integration -- test/integration/route-cutover.test.mjs

      - name: Measure small synthetic local API baseline
        env:
          DYOFFICE_RUN_PERFORMANCE_BASELINE: synthetic-ci-only
        run: cd apps/web && node --import tsx --test test/performance/api-baseline.test.mjs
      - name: Retain small API baseline (not capacity acceptance)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t00-small-api-baseline
          path: apps/web/test-results/performance-baseline.json
          if-no-files-found: warn

      - name: Retain host runtime provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-runtime-boundary-check
          path: .dyoffice-runtime-evidence/host-runtime.json
          if-no-files-found: warn

  native-docx:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DYOFFICE_TEST_DATABASE_URL: postgresql://postgres:dyoffice-ci-test-only@127.0.0.1:55432/dyoffice_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.5'
      - name: Verify immutable Node runtime
        run: node tools/dyoffice/runtime-lock.mjs --runtime
      - name: Verify immutable host Node
        run: node tools/dyoffice/host-runtime.mjs --node-only
      - name: Provision host database and Redis
        run: sudo --preserve-env=GITHUB_ACTIONS bash tools/dyoffice/ci-host-services.sh
      - name: Verify actual host runtime
        run: node tools/dyoffice/host-runtime.mjs
      - name: Install renderer sources without Electron lifecycle scripts
        run: npm ci --ignore-scripts --include=dev
      - name: Install Chromium
        run: node_modules/.bin/playwright install chromium --with-deps
      - name: Regress native save generation and Web bridge state
        run: node --import tsx --test apps/web/test/unit/save-generation.test.mjs apps/web/test/unit/docs-bridge-save.test.mjs
      - name: Regress phased DOCX loading, concurrent edits and draft-copy entry
        run: node --import tsx --test --test-concurrency=1 apps/web/test/unit/docs-phased-load-dirty.test.mjs apps/web/test/unit/docs-save-download-entry.test.mjs
      - name: Check native Web host types
        run: npm run typecheck:web:docs
      - name: Build real DOCX renderer and test native edits over TLS
        run: npm run test:web:docs
      - name: Regress original Docs renderer
        run: npm test --workspace @genoffice/docs
      - name: Regress original DOCX engine
        run: npm test --workspace @genoffice/docx-engine

      - name: Retain host runtime provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-runtime-native-docx
          path: .dyoffice-runtime-evidence/host-runtime.json
          if-no-files-found: warn

  native-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      DYOFFICE_TEST_HOST_MANIFEST: ${{ github.workspace }}/.dyoffice-native-build/host-manifest.json
      DYOFFICE_TEST_DATABASE_URL: postgresql://postgres:dyoffice-ci-test-only@127.0.0.1:55432/dyoffice_test
      DYOFFICE_TEST_REDIS_URL: redis://127.0.0.1:16379/15
      DYOFFICE_TEST_S3_ENDPOINT: http://127.0.0.1:19000
      DYOFFICE_TEST_S3_ACCESS_KEY: dyoffice-ci-s3-test
      DYOFFICE_TEST_S3_SECRET_KEY: dyoffice-ci-s3-test-only-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.5'
      - name: Verify immutable Node runtime
        run: node tools/dyoffice/runtime-lock.mjs --runtime
      - name: Verify immutable host Node
        run: node tools/dyoffice/host-runtime.mjs --node-only
      - name: Install SaaS shared gateway dependencies without Electron
        run: npm ci --ignore-scripts --include=dev
      - name: Provision independent host database and Redis
        run: sudo --preserve-env=GITHUB_ACTIONS bash tools/dyoffice/ci-host-services.sh --objectstore
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Verify actual native host runtime
        run: node tools/dyoffice/host-runtime.mjs --objectstore --native
      - name: Compile original locked Rust engine and bounded native transport
        run: npm run build:web:native -- --with-probe
      - name: Typecheck worker adapters
        run: npm run typecheck:web:worker
      - name: Exercise real host isolation and native XLSX bytes
        run: sudo --preserve-env=PATH,DYOFFICE_TEST_HOST_MANIFEST npm run test:web:sandbox
      - name: Test real native job output, cancellation, recovery and BullMQ redelivery
        run: sudo --preserve-env=PATH,DYOFFICE_TEST_HOST_MANIFEST,DYOFFICE_TEST_DATABASE_URL,DYOFFICE_TEST_REDIS_URL,DYOFFICE_TEST_S3_ENDPOINT,DYOFFICE_TEST_S3_ACCESS_KEY,DYOFFICE_TEST_S3_SECRET_KEY npm run test:web:native-jobs

      - name: Retain host runtime provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: host-runtime-native-worker
          path: .dyoffice-runtime-evidence/host-runtime.json
          if-no-files-found: warn

  native-sheets:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.93.0
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
      DYOFFICE_TEST_HOST_MANIFEST: ${{ github.workspace }}/.dyoffice-native-build/host-manifest.json
      DYOFFICE_TEST_DATABASE_URL: postgresql://postgres:dyoffice-ci-test-only@127.0.0.1:55432/dyoffice_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.5'
      - name: Verify immutable Node runtime
        run: node tools/dyoffice/runtime-lock.mjs --runtime
      - name: Install original renderer and gateway dependencies
        run: npm ci --ignore-scripts --include=dev
      - name: Provision host database and Redis
        run: sudo --preserve-env=GITHUB_ACTIONS bash tools/dyoffice/ci-host-services.sh
      - name: Install Chromium for the workspace Playwright version
        run: |
          node_modules/.bin/playwright --version
          node_modules/.bin/playwright install chromium --with-deps
          npm exec --workspace=@dyoffice/web -- playwright install chromium --with-deps
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Compile original locked Rust engine and sandbox probe
        run: npm run build:web:native -- --with-probe
      - name: Check native Sheets host types
        run: npx tsc -p apps/web/tsconfig.sheets.json
      - name: Build original Sheets renderer and server gateway
        run: npm run build:sheets --workspace=@dyoffice/web
      - name: Test real native editor and authorized save-reopen path
        run: sudo --preserve-env=PATH,DYOFFICE_TEST_HOST_MANIFEST,DYOFFICE_TEST_DATABASE_URL,PLAYWRIGHT_BROWSERS_PATH npm run test:native-sheets --workspace=@dyoffice/web
      - name: Regress original XLSX gateway
        run: npx vitest run --root packages/xlsx-gateway --maxWorkers=1
      - name: Regress original name calculation and undo
        run: npx vitest run --root apps/sheets --maxWorkers=1 tests/defined-name-recalculation.test.ts
