name: DyOffice self-service password change

on:
  push:
    branches: [feat/dyoffice-t03c-account-lifecycle]
    paths:
      - 'apps/web/server/auth/password-change*.mjs'
      - 'apps/web/server/db/migrations/0004_self_password_change.sql'
      - 'apps/web/test/password-change*.test.mjs'
      - 'apps/web/test/integration/password-change.postgres.test.mjs'
      - '.github/workflows/dyoffice-password-change.yml'
  pull_request:
    paths:
      - 'apps/web/server/auth/**'
      - 'apps/web/server/db/**'
      - 'apps/web/test/password-change*.test.mjs'
      - 'apps/web/test/integration/password-change.postgres.test.mjs'
      - 'apps/web/package*.json'
      - '.github/workflows/dyoffice-password-change.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dyoffice-password-change-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  password-change:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dyoffice_test
          POSTGRES_PASSWORD: local-ci-only-not-for-production
          POSTGRES_DB: dyoffice_password_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dyoffice_test -d dyoffice_password_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Syntax and focused unit/HTTP tests
        run: |
          node --check apps/web/server/auth/password-change.mjs
          node --check apps/web/server/auth/password-change-http.mjs
          node --check apps/web/test/integration/password-change.postgres.test.mjs
          node --test apps/web/test/password-change.test.mjs apps/web/test/password-change-http.test.mjs
      - name: Install workspace dependencies without launching Electron
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked Web dependencies with native Argon2id
        run: npm ci --prefix apps/web --workspaces=false --include=dev --no-audit --no-fund
      - name: PostgreSQL HTTP flow, concurrency and transaction rollback
        env:
          DYOFFICE_TEST_DATABASE_URL: postgresql://dyoffice_test:local-ci-only-not-for-production@localhost:5432/dyoffice_password_test
        run: node --test apps/web/test/integration/password-change.postgres.test.mjs
      - name: Web API regressions
        run: npm run test:web
      - name: Web types and production build smoke
        run: |
          npm run typecheck:web
          npm run test:web:build
      - name: Whitespace checks
        run: git diff --check HEAD^
