name: DyOffice T03b local login core

on:
  push:
    branches: [feat/dyoffice-t03b-login-service]
    paths:
      - 'apps/web/server/auth/login-*'
      - 'apps/web/server/auth/http-auth-adapter.mjs'
      - 'apps/web/test/http-auth-adapter.test.mjs'
      - 'apps/web/server/auth/session-core.mjs'
      - 'apps/web/server/db/migrations/0002_login_rate_limits.sql'
      - 'apps/web/test/login-*'
      - 'apps/web/test/integration/local-login.postgres.test.mjs'
      - '.github/workflows/dyoffice-t03b-login.yml'
  pull_request:
    paths:
      - 'apps/web/server/auth/login-*'
      - 'apps/web/server/auth/http-auth-adapter.mjs'
      - 'apps/web/test/http-auth-adapter.test.mjs'
      - 'apps/web/server/auth/session-core.mjs'
      - 'apps/web/server/db/migrations/0002_login_rate_limits.sql'
      - 'apps/web/test/login-*'
      - 'apps/web/test/integration/local-login.postgres.test.mjs'
      - '.github/workflows/dyoffice-t03b-login.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dyoffice_test
          POSTGRES_PASSWORD: local-ci-only-not-for-production
          POSTGRES_DB: dyoffice_login_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dyoffice_test -d dyoffice_login_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Reject malformed login and session source
        run: |
          node --check apps/web/server/auth/http-auth-adapter.mjs
          node --check apps/web/server/auth/login-service.mjs
          node --check apps/web/server/auth/login-throttle.mjs
          node --check apps/web/server/auth/session-core.mjs
          node --check apps/web/test/http-auth-adapter.test.mjs
          node --check apps/web/test/login-service.test.mjs
          node --check apps/web/test/login-throttle.test.mjs
          node --check apps/web/test/login-session-fence.test.mjs
          node --check apps/web/test/integration/local-login.postgres.test.mjs
      - name: Run login, throttle and auth-version unit tests
        run: node --test apps/web/test/login-service.test.mjs apps/web/test/login-throttle.test.mjs apps/web/test/login-session-fence.test.mjs apps/web/test/http-auth-adapter.test.mjs
      - name: Install isolated Web dependencies
        run: npm ci --prefix apps/web --workspaces=false --include=dev --no-audit --no-fund
      - name: Test real PostgreSQL login limits and password-reset race
        env:
          DYOFFICE_TEST_DATABASE_URL: postgresql://dyoffice_test:local-ci-only-not-for-production@localhost:5432/dyoffice_login_test
        run: node --test apps/web/test/integration/local-login.postgres.test.mjs
