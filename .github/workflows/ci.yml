name: CI

# Test gate for every PR and push: changed-file formatting, lint, typecheck across
# active SaaS workspaces and shared engine tests. No desktop product is built
# or packaged; browser layout checks are independent from Electron.

on:
  push:
    branches: [main, 'dev_*', 'release_*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        # SHA-pinned (third-party action); the ref no longer selects the
        # toolchain, so it is passed explicitly.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      - name: Install dependencies
        run: npm ci

      - name: Check dependency licenses
        run: npm run licenses

      - name: Check Rust dependency licenses (xlsx-sidecar)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: apps/sheets/native/xlsx-engine/Cargo.toml

      - name: Check formatting
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # For PRs the checkout is the PR merge commit, so its first parent is the
        # exact main revision the merge was built against. The event's base.sha can
        # lag behind a fast-moving main, which pulls unrelated main-side files into
        # the changed-file set and fails the check on files the PR never touched.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run format:check

      - name: Check theme colors
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:theme-colors

      # Inline text-layout decisions (script tests, face predicates, CJK ranges,
      # compat reads) stay in apps/docs/src/renderer/text-layout/, not in the emitters.
      - name: Check inline text-layout rules
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:inline-rules

      # The pagination preview / PDF export consume the canvas PageCut data
      # (pagination-pass.ts); new lines there must not re-slice, re-measure or
      # look pages up on their own.
      - name: Check page-cut readers
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:page-cut-readers

      # Table column-width decisions (min/max-content, grid rewrites, tcW predicates)
      # stay in apps/docs/src/renderer/table-layout/, not in the callers or the parser.
      - name: Check table layout rules
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:table-layout-rules

      # Face / line-factor / chain decisions stay in text-layout/font-rules/
      - name: Check font rules
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$FORMAT_BASE_REF" ] || ! git rev-parse --verify "$FORMAT_BASE_REF^{commit}" >/dev/null 2>&1; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:font-rules

      # Line-metric numbers (fonts.css size-adjust/overrides, knownLineFactor)
      # must cite the Word measurement they came from.
      - name: Check font-metric provenance
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:font-metrics-provenance

      # fonts.generated.css / line-factors.generated.ts must match the measurement
      # manifest; metric values are never hand-written outside it.
      - name: Check generated font metrics
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:generated-fonts

      # docs/word-truths-index.json and the coverage doc must match the fixtures;
      # a recently dated truths section needs a fixture or a prose-only marker.
      - name: Check Word truths coverage
        run: npm run check:word-truths

      # skills/*/SKILL.md ship to users' agent directories; a body change
      # without a metadata.version bump would never be offered as an update.
      - name: Check skill versions
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          npm run check:skill-version

      # Whole-tree, not changed-files: every one of the manual's 21 languages
      # has to match the English article's structure. A language that quietly
      # falls behind is exactly what no reviewer sees, and it is invisible in a
      # diff — the change that causes it looks like an ordinary translation.
      - name: Check manual language coverage
        run: npm run check:help-langs

      # Added lines only: Han text outside locale tables, review-tool tags,
      # feedback-ledger ids, sample-corpus ids, internal PR numbers, personal
      # paths/e-mails, credentials, NUL bytes (tools/check-public-hygiene.mjs).
      - name: Check public-repo hygiene
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORMAT_BASE_REF=$(git rev-parse HEAD^1)
          fi
          if [ -f tools/check-public-hygiene.mjs ]; then
            node tools/check-public-hygiene.mjs
          else
            echo "public-hygiene gate not present in this checkout; skipped"
          fi

      # Keep tracked code comments and contributor-facing documentation
      # English-only; functional CJK strings and AI prompt examples are allowed.
      - name: Check comments/docs are English-only
        run: npm run check:english-comments

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Regenerate test fixtures
        run: npm run fixtures

      # Generation is byte-deterministic (zip entry mtimes are pinned in
      # tests/helpers/build-docx.ts); a diff here means the generator and the
      # committed fixtures have drifted apart.
      - name: Check committed fixtures match the generator
        run: git diff --exit-code -- fixtures/generated

      # pptx-engine's OOXML schema gate validates saved decks with xmllint
      # (tools/ooxml-validate); the runner image is not guaranteed to have it.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils

      # Build only the shared server-side XLSX engine. Desktop clipboard helpers
      # are not part of SaaS CI or the headless CLI audit runtime.
      - name: Build xlsx-sidecar (the CLI audit tests run against it)
        run: |
          cargo build --release --manifest-path apps/sheets/native/xlsx-engine/Cargo.toml --config apps/sheets/native/xlsx-engine/.cargo/config.toml
          # the sidecar-gated CLI tests read the generated compatibility fixture
          # (gitignored, normally produced by the sheets gate below)
          npm run fixtures -w @genoffice/sheets

      - name: Test
        run: npm test

      # Preservation gate: a no-op-adjacent edit through the OOXML gateway must
      # leave every untouched package entry byte-identical (fails closed otherwise).
      - name: Sheets compatibility gate
        run: |
          npm run fixtures -w @genoffice/sheets
          npm run compat -w @genoffice/sheets

  browser-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and its supported system dependencies
        run: npx playwright install --with-deps chromium
      - name: Install document fonts
        run: sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-cjk
      - name: Browser layout tests
        run: npm run test:e2e
      - name: Markdown browser tests
        run: npx playwright test --config apps/markdown/playwright.config.ts
      - name: Upload browser test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-layout-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
