name: DyOffice original shell UI
on:
  pull_request:
    paths: ['tools/dyoffice/runtime-lock*', 'apps/web/**', 'apps/shell/src/renderer/**', 'packages/ui/**', 'package-lock.json', '.github/workflows/dyoffice-shell-ui.yml']
  push:
    branches: [feat/dyoffice-web]
    paths: ['tools/dyoffice/runtime-lock*', 'apps/web/**', 'apps/shell/src/renderer/**', 'packages/ui/**', 'package-lock.json', '.github/workflows/dyoffice-shell-ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.5'
      - name: Verify immutable Node runtime
        run: node tools/dyoffice/runtime-lock.mjs --runtime
      - run: npm ci --ignore-scripts
      - run: node --experimental-strip-types --test apps/web/test/unit/shell-home.test.mjs
      - run: npm run typecheck:shell --prefix apps/web --workspaces=false
      - run: npm run test:shell --prefix apps/web --workspaces=false
      - run: npm run build:web:shell
