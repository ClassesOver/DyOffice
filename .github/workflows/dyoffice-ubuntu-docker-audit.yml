name: DyOffice Ubuntu Docker capability audit (not isolation acceptance)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dyoffice-ubuntu-docker-audit
  cancel-in-progress: false
jobs:
  readonly-audit:
    if: github.repository == 'ClassesOver/DyOffice' && github.ref == 'refs/heads/feat/dyoffice-web'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test read-only collector and fail-closed classification
        run: python3 -m unittest discover -s tools/dyoffice/tests -p test_ubuntu_docker_audit.py -v
      - name: Audit host only; unsupported exits 2 (no container launch)
        run: python3 tools/dyoffice/audit-ubuntu-docker.py ubuntu-docker-audit.json
      - name: Preserve constrained audit report even when unsupported
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ubuntu-docker-capability-audit-${{ github.run_id }}
          path: ubuntu-docker-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: State the diagnostic boundary
        if: always()
        run: |
          printf '%s\n' '## Read-only Ubuntu Docker audit' 'This job does not launch a container or certify isolation.' 'Unsupported is a nonzero result, not an acceptance pass. See the bounded JSON artifact for missing and unverified conditions.' >> "$GITHUB_STEP_SUMMARY"
